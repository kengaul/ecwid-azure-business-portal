apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: business-tools
spec:
  ingressClassName: traefik
  tls:
    - hosts:
      - macmini.localdomain
      secretName: business-tools-tls
  rules:
    - host: macmini.localdomain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: business-tools-web
                port:
                  name: http
