apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: business-tools

resources:
  - namespace.yaml
  - api-deployment.yaml
  - api-service.yaml
  - oauth2-proxy-deployment.yaml
  - oauth2-proxy-service.yaml
  - web-deployment.yaml
  - web-service.yaml

configMapGenerator:
  - name: business-tools-config
    literals:
      - APP_ENVIRONMENT=kubernetes
      - FRONTPAGE_MAX_SKUS=200
      - OAUTH2_PROXY_REDIRECT_URL=https://business-tools.local/oauth2/callback

generatorOptions:
  disableNameSuffixHash: true
