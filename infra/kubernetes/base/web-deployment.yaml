apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-tools-web
  labels:
    app.kubernetes.io/name: business-tools-web
    app.kubernetes.io/part-of: business-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: business-tools-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-tools-web
        app.kubernetes.io/part-of: business-tools
    spec:
      containers:
        - name: web
          image: ghcr.io/example/business-tools-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://business-tools-api:8000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
