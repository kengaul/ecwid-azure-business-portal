apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-tools-oauth2-proxy
  labels:
    app.kubernetes.io/name: business-tools-oauth2-proxy
    app.kubernetes.io/part-of: business-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: business-tools-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-tools-oauth2-proxy
        app.kubernetes.io/part-of: business-tools
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          imagePullPolicy: IfNotPresent
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=$(OIDC_ISSUER_URL)
            - --email-domain=*
            - --upstream=static://202
            - --reverse-proxy=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --skip-provider-button=true
          ports:
            - name: http
              containerPort: 4180
          env:
            - name: OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: business-tools-auth-secret
                  key: OIDC_ISSUER_URL
            - name: OAUTH2_PROXY_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: business-tools-config
                  key: OAUTH2_PROXY_REDIRECT_URL
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: business-tools-auth-secret
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: business-tools-auth-secret
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: business-tools-auth-secret
                  key: OAUTH2_PROXY_COOKIE_SECRET
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
