apiVersion: v1
kind: Secret
metadata:
  name: business-tools-api-secret
  namespace: business-tools
type: Opaque
stringData:
  ECWID_API_TOKEN: <replacewithapitoken>
  ECWID_SHOP_ID: <replacewithshopid>
---
apiVersion: v1
kind: Secret
metadata:
  name: business-tools-auth-secret
  namespace: business-tools
type: Opaque
stringData:
  OIDC_ISSUER_URL: https://login.microsoftonline.com/<replacewithtenantid>/v2.0
  OAUTH2_PROXY_CLIENT_ID: <replacewithclientid>
  OAUTH2_PROXY_CLIENT_SECRET: <replacewithclientsecret>
  OAUTH2_PROXY_COOKIE_SECRET: <replace-with-32-byte-base64-value>
