name: Publish Containers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/business-tools-api/**
      - apps/business-tools-web/**
      - .github/workflows/publish-containers.yml

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/business-tools-api
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/business-tools-web

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            image_name: ${{ github.repository_owner }}/business-tools-api
            context: apps/business-tools-api
          - name: web
            image_name: ${{ github.repository_owner }}/business-tools-web
            context: apps/business-tools-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
