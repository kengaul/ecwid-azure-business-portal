name: Deploy Business Tools

on:
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy Function App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Python Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          package: apps/business-tools-api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true

  deploy-web:
    name: Deploy Static Web App
    runs-on: ubuntu-latest
    needs: deploy-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/business-tools-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/business-tools-web

      - name: Build web app
        run: npm run build
        working-directory: apps/business-tools-web

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/business-tools-web/dist
          skip_app_build: true
          skip_api_build: true
