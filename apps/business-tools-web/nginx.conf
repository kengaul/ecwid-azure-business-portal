server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default for every tool, including future proxy locations. Only the
    # authentication handshake and the Kubernetes health check opt out.
    auth_request /_auth;
    error_page 401 = /oauth2/sign_in;

    location = /healthz {
        auth_request off;
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /_auth {
        internal;
        auth_request off;
        access_log off;
        proxy_pass ${AUTH_UPSTREAM}/oauth2/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host ${PUBLIC_HOST};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host ${PUBLIC_HOST};
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Auth-Request-Redirect ${PUBLIC_ORIGIN}$request_uri;
    }

    location /oauth2/ {
        auth_request off;
        # Callback query strings contain authentication codes.
        access_log off;
        proxy_pass ${AUTH_UPSTREAM};
        proxy_set_header Host ${PUBLIC_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host ${PUBLIC_HOST};
        proxy_set_header X-Auth-Request-Redirect ${PUBLIC_ORIGIN}$request_uri;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    location /api/ {
        # Expired API sessions return 401 rather than an HTML login page.
        error_page 401 = @unauthorized;
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.auth/me {
        error_page 401 = @unauthorized;
        proxy_pass ${AUTH_UPSTREAM}/oauth2/userinfo;
        proxy_set_header Host ${PUBLIC_HOST};
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }

    location = /.auth/logout {
        return 302 /oauth2/sign_out;
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"error":"Your session has expired. Reload the page to sign in."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
